<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casebook - Simple Investigation</title>
    <!-- Bootstrap 5 CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <!-- Optional: Project CSS linking as requested -->
    <link rel="stylesheet" href="./styles/style.css">

    <style>
        /* Restrict the library showcase box from growing indefinitely */
        #savedCasesGrid {
            max-height: 480px;        /* Fixes the display height to roughly 2 rows of posters */
            overflow-y: auto;         /* Turns on vertical scrolling only when content spills over */
            overflow-x: hidden;        /* Prevents awkward horizontal shifting */
            padding-right: 8px;       /* Leaves breathing room for the scrollbar */
        }

        /* Custom sleek scrollbar styling to match your dark investigator theme */
        #savedCasesGrid::-webkit-scrollbar {
            width: 6px;
        }
        #savedCasesGrid::-webkit-scrollbar-track {
            background: #12141c;
            border-radius: 4px;
        }
        #savedCasesGrid::-webkit-scrollbar-thumb {
            background: #3a4154;
            border-radius: 4px;
        }
        #savedCasesGrid::-webkit-scrollbar-thumb:hover {
            background: #cda252;      /* Gold highlights when hovered */
        }
    </style>

</head>
<body>

   <div class="logo-header" style="text-align: center;">
     <h1>
        <img class="fluid" src="assets/logo.png" alt="CaseBook Logo" height="50px;"/>
        CaseBook
    </h1>
    </div>

    <!-- Investigator Filing Cabinet / Poster Grid Showcase -->
    <div class="container mt-2 mb-5">
        <div class="case-card shadow-lg" style="border-color: #3a4154; max-width: 100%;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="mb-0 text-uppercase tracking-wider text-warning" style="font-size: 1.2rem; letter-spacing: 1px;">
                        🎬 MY INVESTIGATION LOGS
                    </h4>
                    <small class="">Click any poster to pull up your old case files and theories</small>
                </div>
                <span id="caseCountBadge" class="badge bg-secondary px-3 py-2">0 Cases Logged</span>
            </div>
            
            <!-- Grid layout changing from text to visual media cards -->
            <div id="savedCasesGrid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-4">
                <!-- Dynamic movie poster cards land here -->
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <div class="case-card shadow-lg" style="max-width: 100%;">
            
            <!-- Movie Search Section -->
            <div class="position-relative mb-4">
                <label class="form-label fw-bold text-uppercase small">Search Movie (TMDB)</label>
                <input type="text" id="movieSearch" class="form-control form-control-lg" placeholder="Type a movie title...">
                <div id="searchResults" class="search-results-dropdown d-none"></div>
            </div>

            <!-- Movie Metadata Display -->
            <div id="movieMetadata" class="mb-3 text-center text-sm-start">
                <div class="row align-items-center g-3">
                    <div class="col-sm-3 col-12 text-center">
                        <img id="moviePoster" src="https://placehold.co/150x225/12141c/2a2f3d?text=No+Poster" class="img-fluid rounded border border-secondary" style="max-height: 225px;" alt="Poster">
                    </div>
                    <div class="col-sm-8 col-12">
                        <h3 id="movieTitle" class="mb-2">—</h3>
                        
                        <div class="mt-3">
                            <label class="form-label fw-bold text-uppercase small mb-1">Overview (TMDB)</label>
                            
                            <!-- Parent container providing a bounding box -->
                            <div class="position-relative bg-dark rounded p-3" style="min-height: 100px; border: 1px solid #2a2f3d;">
                                
                                <!-- Centered Action Button Box Layered on Top -->
                                <div id="synopsisRevealBtnContainer" class="position-absolute top-50 start-50 translate-middle d-none" style="z-index: 20;">
                                    <button type="button" id="btnRevealSynopsis" class="btn btn-sm btn-warning px-3 shadow fw-bold text-dark">
                                        👁️ Click to Reveal Synopsis
                                    </button>
                                </div>
                                
                                <!-- The underlying text wrapper -->
                                <div id="synopsisBlurWrapper" class="synopsis-blur-wrapper">
                                    <p id="movieOverview" class="small mb-0">Select a movie above to populate data.</p>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <hr>

            <!-- Premise Section -->
            <div class="mb-4">
                <label for="premise" class="form-label fw-bold text-uppercase small">Premise</label>
                <textarea id="premise" class="form-control" rows="3" placeholder="Enter basic situation..."></textarea>
            </div>

            <hr>

            <!-- Promise Section -->
            <div class="mb-4">
                <label for="promise" class="form-label fw-bold text-uppercase small">Promise</label>
                <textarea id="promise" class="form-control" rows="3" placeholder="Enter what the movie delivers..."></textarea>
            </div>

            <hr>

            <!-- Dynamic Questions Section -->
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label fw-bold text-uppercase small mb-0">Questions</label>
                    <button type="button" id="btnAddQuestion" class="btn btn-sm btn-custom-secondary">+ Add Question</button>
                </div>
                <div id="questionsContainer">
                    <!-- Dynamic entries land here -->
                </div>
            </div>

            <hr>

            <!-- Hypothesis Section -->
            <div class="mb-4">
                <label for="hypothesis" class="form-label fw-bold text-uppercase small">Hypothesis</label>
                <textarea id="hypothesis" class="form-control" rows="3" placeholder="Enter your working theory..."></textarea>
            </div>

            <hr>

            <!-- General Notes Section -->
            <div class="mb-4">
                <label for="generalNotes" class="form-label fw-bold text-uppercase small">General Notes</label>
                <textarea id="generalNotes" class="form-control" rows="5" placeholder="Enter any extra insights, scene trackers, timestamps..."></textarea>
            </div>

            <hr>

            <!-- Action Trigger -->
            <div class="d-flex gap-3">
                <button type="button" id="btnClearCase" class="btn btn-lg btn-custom-secondary w-50 py-3">
                   <img src="assets/eraser.png" alt="Eraser image" height="25px;"/>
                    Clear / New Investigation
                </button>
                <button type="button" id="btnSaveCase" class="btn btn-lg btn-custom-primary w-50 py-3">
                    <img src="assets/save.png" alt="Eraser image" height="25px;"/>
                    Save Case
                </button>
            </div>

        </div>
    </div>

    <!-- Script file linking if externalized -->
    <script src="./scripts/script.js" type="text/javascript" defer></script>

    <div id="version">
        <small>v1.0.0</small>
    </div>
</body>
</html>
